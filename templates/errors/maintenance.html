{% extends "base.html" %}
{% load static %}

{% block title %}Maintenance - {{ site_name }}{% endblock %}

{% block content %}
<div class="error-container" style="min-height: 70vh; display: flex; align-items: center; justify-content: center; padding: 2rem;">
    <div style="text-align: center; max-width: 500px;">
        <div style="font-size: 4rem; font-weight: 800; color: #D4AF37; font-family: 'Montserrat', sans-serif;"><i class="fas fa-tools"></i></div>
        <h1 style="font-family: 'Montserrat', sans-serif; margin: 1rem 0;">Site en maintenance</h1>
        <p style="color: #6C757D; margin-bottom: 2rem;">La plateforme est temporairement indisponible pour une mise à jour. Nous serons de retour très bientôt.</p>
        <div style="width: 50px; height: 50px; margin: 0 auto; border: 3px solid #E9ECEF; border-top-color: #0077B6; border-radius: 50%; animation: spin 1s linear infinite;"></div>
    </div>
</div>
<style>
    @keyframes spin {
        to { transform: rotate(360deg); }
    }
</style>
{% endblock %}
