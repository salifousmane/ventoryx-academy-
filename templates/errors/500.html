{% extends "base.html" %}
{% load static %}

{% block title %}Erreur serveur - {{ site_name }}{% endblock %}

{% block content %}
<div class="error-container" style="min-height: 70vh; display: flex; align-items: center; justify-content: center; padding: 2rem;">
    <div style="text-align: center; max-width: 500px;">
        <div style="font-size: 6rem; font-weight: 800; color: #ef4444; font-family: 'Montserrat', sans-serif;">500</div>
        <h1 style="font-family: 'Montserrat', sans-serif; margin: 1rem 0;">Erreur interne</h1>
        <p style="color: #6C757D; margin-bottom: 2rem;">Une erreur technique s'est produite. Notre équipe a été notifiée automatiquement.</p>
        <a href="{% url 'core:index' %}" class="btn btn-primary" style="display: inline-block; padding: 0.8rem 2rem; background: #0077B6; color: white; border-radius: 50px; text-decoration: none;">Retour à l'accueil</a>
    </div>
</div>
{% endblock %}
