# Fly.io Configuration
# https://fly.io/docs/

app = "ventoryx-academy"
primary_region = "cdg"  # Paris (Europe)

[build]
  dockerfile = "./Dockerfile"

[env]
  PYTHONUNBUFFERED = "true"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

# PostgreSQL
[[services]]
  protocol = "tcp"
  internal_port = 5432
  processes = ["db"]
  [services.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

# Redis (optionnel, pour Celery)
[[services]]
  protocol = "tcp"
  internal_port = 6379
  processes = ["cache"]

[[statics]]
  guest_path = "/app/staticfiles"
  url_prefix = "/static"

[[statics]]
  guest_path = "/app/media"
  url_prefix = "/media"

# Autoscaling
[processes]
  app = "gunicorn wsgi:application -w 4 -b 0.0.0.0:8080 --timeout 30"
  # Les worker Celery (optionnel)
  # worker = "celery -A ventoryx_academy worker -l info --concurrency=2"
  # beat = "celery -A ventoryx_academy beat -l info"

[deploy]
  release_command = "python manage.py migrate && python manage.py collectstatic --noinput && python seed.py"

[[vm]]
  memory = "512mb"
  cpus = 1
